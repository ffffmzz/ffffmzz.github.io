name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read published package
        uses: actions/checkout@v4
      - name: Extract reviewed website
        run: |
          unzip -q portfolio-github-pages-20260910.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll
          for project in sugar plantcare tencent kkh lumina; do
            test -f "_site/work/$project/index.html"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
